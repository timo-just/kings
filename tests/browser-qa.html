<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kings browser checks</title></head><body><pre id="qa">running</pre><iframe id="app" src="../index.html" width="430" height="932"></iframe><script type="module">
const output=document.getElementById('qa'),frame=document.getElementById('app');
try{
 await new Promise(resolve=>frame.onload=resolve);const d=frame.contentDocument;
 const check=(v,label)=>{if(!v)throw Error(label);};
 check(!d.getElementById('home').hidden,'main menu must be visible');
 const select=d.getElementById('languageSelect');select.value='en';select.dispatchEvent(new frame.contentWindow.Event('change'));
 check(d.getElementById('menuNew').textContent==='New game','English menu');
 select.value='de';select.dispatchEvent(new frame.contentWindow.Event('change'));check(d.getElementById('menuNew').textContent==='Neues Spiel','German menu');
 d.getElementById('menuNew').click();check(!d.getElementById('setup').hidden,'game setup');check(d.getElementById('onlineSetup').checked,'online rooms are mandatory');
 output.textContent='PASS: main menu, both languages and online game setup';
}catch(e){output.textContent='FAIL: '+e.stack;}
</script></body></html>
